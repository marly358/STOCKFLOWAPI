$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Categoría no autorizada {{$guid}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{bodegueroToken}}"
scripts:
  - type: afterResponse
    code: pm.test('bodeguero no crea categorías', function () { pm.response.to.have.status(403); pm.response.to.be.json; });
    language: text/javascript
order: 7000
