$kind: http-request
url: "{{baseUrl}}/api/inventario/existencias"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{bodegueroToken}}"
scripts:
  - type: afterResponse
    code: pm.test('responde 200 con existencias en formato JSON', function () { pm.response.to.have.status(200); pm.response.to.be.json; pm.expect(pm.response.json()).to.be.an('array'); });
    language: text/javascript
order: 1000
