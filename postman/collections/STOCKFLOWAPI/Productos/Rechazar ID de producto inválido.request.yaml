$kind: http-request
url: "{{baseUrl}}/api/productos/id-invalido"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "stock": 4
    }
scripts:
  - type: afterResponse
    code: pm.test('responde 400 para un ID inválido', function () { pm.response.to.have.status(400); pm.response.to.be.json; pm.expect(pm.response.json().message).to.eql('El identificador del producto no es válido.'); });
    language: text/javascript
order: 7000
