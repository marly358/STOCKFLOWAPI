$kind: http-request
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "",
      "precio": -1,
      "stock": 1.5
    }
scripts:
  - type: afterResponse
    code: pm.test('responde 400 con errores de validación', function () { pm.response.to.have.status(400); pm.response.to.be.json; const body = pm.response.json(); pm.expect(body.message).to.eql('Los datos del producto no son válidos.'); pm.expect(body.errors).to.be.an('array').that.is.not.empty; });
    language: text/javascript
order: 4000
