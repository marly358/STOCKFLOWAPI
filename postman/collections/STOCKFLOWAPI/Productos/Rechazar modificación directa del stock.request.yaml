$kind: http-request
url: "{{baseUrl}}/api/productos/{{productId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "stock": 25
    }
scripts:
  - type: afterResponse
    code: pm.test('rechaza modificar stock directamente', function () { pm.response.to.have.status(400); pm.response.to.be.json; pm.expect(pm.response.json().errors.join(' ')).to.include('stock solo puede modificarse'); });
    language: text/javascript
order: 8000
