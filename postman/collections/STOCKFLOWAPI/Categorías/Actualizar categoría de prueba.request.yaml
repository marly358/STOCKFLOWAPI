$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoryId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "descripcion": "Actualizada por Newman"
    }
scripts:
  - type: afterResponse
    code: pm.test('admin actualiza la categoría de prueba', function () { pm.response.to.have.status(200); pm.response.to.be.json; const body = pm.response.json(); pm.expect(body.categoria._id).to.eql(pm.collectionVariables.get('categoryId')); pm.expect(body.categoria.descripcion).to.eql('Actualizada por Newman'); });
    language: text/javascript
order: 5000
