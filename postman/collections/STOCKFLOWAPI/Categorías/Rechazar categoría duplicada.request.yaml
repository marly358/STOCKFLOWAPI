$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{categoryName}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('responde 409 para una categoría duplicada', function () { pm.response.to.have.status(409); pm.response.to.be.json; pm.expect(pm.response.json().message).to.eql('Ya existe una categoría con ese nombre.'); });
    language: text/javascript
order: 4000
